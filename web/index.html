<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luma — Find Meaningful Connections</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FF3366;
      --primary-gradient: linear-gradient(135deg, #FF3366 0%, #FF655B 50%, #FF884D 100%);
      --superlike-gradient: linear-gradient(135deg, #00C6FF 0%, #0072FF 100%);
      --pass-color: #FF4B4B;
      --bg-dark: #0D0E15;
      --card-bg: #1A1C28;
      --surface: #242738;
      --text-main: #FFFFFF;
      --text-muted: #8E92B2;
      --border: rgba(255, 255, 255, 0.08);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Mobile Container Simulator */
    .app-frame {
      width: 420px;
      height: 860px;
      background-color: var(--card-bg);
      border-radius: 40px;
      border: 1px solid var(--border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* App Header */
    .app-header {
      padding: 20px 24px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: var(--primary-gradient);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.1);
    }

    /* Main Screen Content */
    .screen-content {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 10px 20px 20px;
    }

    /* Card Deck Stack */
    .deck-container {
      flex: 1;
      position: relative;
      width: 100%;
    }

    .profile-card {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
      cursor: grab;
      user-select: none;
    }

    .profile-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.9) 100%);
      z-index: 1;
    }

    .profile-info {
      position: relative;
      z-index: 2;
    }

    .profile-name-age {
      font-size: 28px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .verified-badge {
      width: 22px;
      height: 22px;
      background: #00C6FF;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .profile-location {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .profile-bio {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 10px;
      line-height: 1.4;
    }

    /* Swipe Action Controls */
    .swipe-controls {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      padding-top: 16px;
      z-index: 10;
    }

    .action-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: white;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .action-btn:hover {
      transform: scale(1.15);
    }

    .action-btn.pass {
      color: var(--pass-color);
      border-color: rgba(255, 75, 75, 0.3);
    }

    .action-btn.like {
      width: 72px;
      height: 72px;
      background: var(--primary-gradient);
      font-size: 28px;
    }

    .action-btn.superlike {
      background: var(--superlike-gradient);
    }

    /* Match Overlay Modal */
    .match-modal {
      position: absolute;
      inset: 0;
      background: rgba(13, 14, 21, 0.95);
      backdrop-filter: blur(15px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .match-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .match-title {
      font-size: 36px;
      font-weight: 800;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 2px;
      animation: pulse 1.5s infinite;
    }

    .match-avatars {
      display: flex;
      align-items: center;
      gap: -20px;
      margin: 30px 0;
    }

    .match-avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 4px solid var(--primary);
      object-fit: cover;
      box-shadow: 0 10px 25px rgba(255, 51, 102, 0.4);
    }

    .match-btn {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      background: var(--primary-gradient);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
      transition: transform 0.2s;
    }

    .match-btn:hover {
      transform: scale(1.02);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>

  <!-- App Mobile Frame Simulator -->
  <div class="app-frame">
    <!-- Header -->
    <div class="app-header">
      <div class="brand">
        <div class="brand-logo">🔥</div>
        <div class="brand-title">luma</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="toggleFilter()">⚙️</button>
        <button class="icon-btn" onclick="openChat()">💬</button>
      </div>
    </div>

    <!-- Screen Content (Swipe Deck) -->
    <div class="screen-content">
      <div class="deck-container" id="deckContainer">
        <!-- Cards injected dynamically via JavaScript -->
      </div>

      <!-- Action Buttons -->
      <div class="swipe-controls">
        <button class="action-btn pass" onclick="handleSwipe('dislike')">✖</button>
        <button class="action-btn superlike" onclick="handleSwipe('superlike')">⭐</button>
        <button class="action-btn like" onclick="handleSwipe('like')">💖</button>
      </div>
    </div>

    <!-- It's a Match Modal Popup -->
    <div class="match-modal" id="matchModal">
      <div class="match-title">It's a Match!</div>
      <p style="color: var(--text-muted); margin-top: 8px;">You and <span id="matchName">Sophia</span> liked each other</p>
      
      <div class="match-avatars">
        <img class="match-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" alt="Me">
        <img class="match-avatar" id="matchAvatar" src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=300" alt="Match">
      </div>

      <button class="match-btn" onclick="closeMatchModal()">Send a Message 💬</button>
      <button class="match-btn" style="background: transparent; border: 1px solid var(--border);" onclick="closeMatchModal()">Keep Swiping</button>
    </div>
  </div>

  <script>
    // Demo Candidate Profiles Data
    const demoCandidates = [
      {
        id: "cand-1",
        full_name: "Sophia Martinez",
        age: 24,
        city: "New York, 3 km away",
        bio: "Architect & coffee addict ☕. Looking for someone to explore hidden rooftop bars with ✨",
        photo: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600"
      },
      {
        id: "cand-2",
        full_name: "Elena Rostova",
        age: 26,
        city: "Brooklyn, 5 km away",
        bio: "UX Designer 🎨. Passionate about live indie concerts, photography & weekend hiking 🏔️",
        photo: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600"
      },
      {
        id: "cand-3",
        full_name: "Aria Chen",
        age: 23,
        city: "Manhattan, 2 km away",
        bio: "Foodie & dog mom 🐶. Let's debate whether pineapple belongs on pizza over drinks 🍕🍸",
        photo: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=600"
      }
    ];

    let currentIndex = 0;

    function renderCards() {
      const container = document.getElementById('deckContainer');
      container.innerHTML = '';

      if (currentIndex >= demoCandidates.length) {
        container.innerHTML = `
          <div style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
            <div style="font-size: 48px;">🎉</div>
            <h3 style="margin-top: 12px;">You've seen everyone nearby!</h3>
            <p style="color: var(--text-muted); font-size: 14px; margin-top: 6px;">Expand your distance filter to discover more people.</p>
            <button class="match-btn" style="width: auto; padding: 12px 24px; margin-top: 20px;" onclick="resetDeck()">Reset Feed</button>
          </div>
        `;
        return;
      }

      const candidate = demoCandidates[currentIndex];
      const card = document.createElement('div');
      card.className = 'profile-card';
      card.style.backgroundImage = `url('${candidate.photo}')`;

      card.innerHTML = `
        <div class="profile-info">
          <div class="profile-name-age">
            ${candidate.full_name}, ${candidate.age}
            <span class="verified-badge">✓</span>
          </div>
          <div class="profile-location">📍 ${candidate.city}</div>
          <div class="profile-bio">${candidate.bio}</div>
        </div>
      `;

      container.appendChild(card);
    }

    function handleSwipe(action) {
      if (currentIndex >= demoCandidates.length) return;

      const currentCandidate = demoCandidates[currentIndex];
      const card = document.querySelector('.profile-card');

      if (card) {
        if (action === 'like' || action === 'superlike') {
          card.style.transform = 'translateX(500px) rotate(30deg)';
          card.style.opacity = '0';

          // Simulate 50% chance of mutual match for demo
          if (currentIndex % 2 === 0) {
            setTimeout(() => {
              triggerMatchModal(currentCandidate);
            }, 300);
          }
        } else {
          card.style.transform = 'translateX(-500px) rotate(-30deg)';
          card.style.opacity = '0';
        }
      }

      setTimeout(() => {
        currentIndex++;
        renderCards();
      }, 300);
    }

    function triggerMatchModal(candidate) {
      document.getElementById('matchName').innerText = candidate.full_name.split(' ')[0];
      document.getElementById('matchAvatar').src = candidate.photo;
      document.getElementById('matchModal').classList.add('active');
    }

    function closeMatchModal() {
      document.getElementById('matchModal').classList.remove('active');
    }

    function resetDeck() {
      currentIndex = 0;
      renderCards();
    }

    function toggleFilter() {
      alert("Filter settings: Radius set to 50km | Age range: 18 - 35");
    }

    function openChat() {
      alert("Chat Module connected over WebSockets (Socket.io)");
    }

    // Initialize Card Deck on Load
    renderCards();
  </script>
</body>
</html>
